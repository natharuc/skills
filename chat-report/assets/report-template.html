<!doctype html>
<html lang="$document_language">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>$document_title</title>
  <style id="chat-report-styles">
    .chat-report { --cr-ink:#172c40; --cr-muted:#586773; --cr-line:#d9dedc; --cr-paper:#fffefa; --cr-bg:#f2f3ee; --cr-green:#23604c; --cr-gold:#88651a; box-sizing:border-box; margin:0 auto; padding:40px 28px 28px; max-width:1200px; min-width:0; background:var(--cr-bg); color:var(--cr-ink); font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .chat-report *, .chat-report *::before, .chat-report *::after { box-sizing:border-box; }
    .chat-report h1, .chat-report h2, .chat-report h3, .chat-report p { margin:0; }
    .chat-report a { color:var(--cr-green); text-underline-offset:3px; overflow-wrap:anywhere; }
    .chat-report .cr-kicker { font-size:11px; font-weight:750; letter-spacing:.16em; text-transform:uppercase; }
    .chat-report .cr-hero { border-radius:20px; padding:34px 36px 30px; color:#f9fbf6; background:#172c40; position:relative; overflow:hidden; }
    .chat-report .cr-hero::before { content:""; position:absolute; right:-70px; top:-95px; width:250px; height:250px; border:1px solid #ffffff1c; border-radius:50%; pointer-events:none; }
    .chat-report .cr-hero .cr-kicker { color:#b6d5c8; }
    .chat-report h1 { font-size:clamp(27px,4vw,43px); line-height:1.12; letter-spacing:-.035em; max-width:850px; margin:13px 0 17px; overflow-wrap:anywhere; }
    .chat-report .cr-scope { color:#d4dce2; max-width:820px; overflow-wrap:anywhere; }
    .chat-report .cr-period { display:flex; flex-wrap:wrap; gap:10px 30px; margin-top:24px; padding-top:20px; border-top:1px solid #ffffff26; }
    .chat-report .cr-period div { min-width:0; }
    .chat-report .cr-period dt { color:#a9bac7; font-size:11px; text-transform:uppercase; letter-spacing:.07em; }
    .chat-report .cr-period dd { margin:3px 0 0; font-size:13px; overflow-wrap:anywhere; }
    .chat-report .cr-summary { margin:22px 2px 0; max-width:950px; font-size:17px; line-height:1.6; overflow-wrap:anywhere; }
    .chat-report .cr-kpis { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; margin:26px 0 30px; }
    .chat-report .cr-kpi { background:var(--cr-paper); border:1px solid var(--cr-line); border-radius:15px; padding:20px 21px; min-width:0; border-top:3px solid #466d60; }
    .chat-report .cr-kpi-label { font-size:12px; color:var(--cr-muted); font-weight:650; margin-bottom:13px; overflow-wrap:anywhere; }
    .chat-report .cr-kpi-value { font-size:clamp(23px,3vw,31px); font-weight:740; letter-spacing:-.045em; line-height:1.12; margin-bottom:16px; overflow-wrap:anywhere; }
    .chat-report .cr-kpi-value.cr-missing { font-size:22px; font-weight:550; letter-spacing:-.025em; color:#66747d; }
    .chat-report .cr-badges { display:flex; flex-wrap:wrap; align-items:center; gap:6px; }
    .chat-report .cr-badge { display:inline-block; padding:3px 8px; border-radius:5px; font-size:11px; line-height:1.5; font-weight:750; letter-spacing:.01em; }
    .chat-report .cr-measured { color:#1f604b; background:#e5f2e9; }
    .chat-report .cr-declared { color:#2e5c74; background:#e4eff6; }
    .chat-report .cr-calculated { color:#374c85; background:#e9edf9; }
    .chat-report .cr-estimated { color:#7c5815; background:#fcf0d5; }
    .chat-report .cr-unavailable { color:#5b6770; background:#eceeed; }
    .chat-report .cr-coverage { color:var(--cr-muted); font-size:11px; line-height:1.5; }
    .chat-report .cr-kpi-note { color:var(--cr-muted); font-size:12px; margin-top:12px; overflow-wrap:anywhere; }
    .chat-report .cr-section { margin:0 0 26px; background:var(--cr-paper); border:1px solid var(--cr-line); border-radius:16px; overflow:hidden; }
    .chat-report .cr-section-head { padding:22px 24px 17px; }
    .chat-report h2 { font-size:19px; letter-spacing:-.02em; line-height:1.3; }
    .chat-report .cr-subtitle { color:var(--cr-muted); font-size:12px; margin-top:5px; }
    .chat-report .cr-table-wrap { overflow-x:auto; }
    .chat-report table { width:100%; border-collapse:collapse; text-align:left; table-layout:fixed; }
    .chat-report th { color:var(--cr-muted); font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:700; padding:12px 24px; background:#f5f6f1; border-top:1px solid var(--cr-line); }
    .chat-report th:first-child { width:25%; }
    .chat-report th:nth-child(2) { width:23%; }
    .chat-report td { vertical-align:top; padding:17px 24px; border-top:1px solid #e5e8e2; overflow-wrap:anywhere; }
    .chat-report .cr-metric-label { font-weight:620; }
    .chat-report .cr-result { font-weight:700; line-height:1.4; margin-bottom:7px; }
    .chat-report .cr-source-text, .chat-report .cr-note { color:var(--cr-muted); font-size:12px; }
    .chat-report .cr-note { margin-top:6px; }
    .chat-report .cr-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); gap:24px; align-items:start; }
    .chat-report .cr-content { padding:0 24px 24px; }
    .chat-report .cr-timeline { list-style:none; padding:0; margin:0; }
    .chat-report .cr-timeline li { position:relative; border-left:1px solid #bccdc2; padding:0 0 24px 21px; margin-left:5px; }
    .chat-report .cr-timeline li::before { content:""; position:absolute; width:9px; height:9px; border:2px solid var(--cr-paper); background:var(--cr-green); border-radius:50%; left:-5px; top:5px; }
    .chat-report .cr-timeline li:last-child { padding-bottom:0; }
    .chat-report .cr-time { font-size:11px; color:var(--cr-muted); margin-bottom:4px; overflow-wrap:anywhere; }
    .chat-report .cr-item-title { font-weight:650; font-size:14px; overflow-wrap:anywhere; }
    .chat-report .cr-item-detail { font-size:13px; color:var(--cr-muted); margin-top:5px; overflow-wrap:anywhere; }
    .chat-report .cr-deliverables { list-style:none; margin:0; padding:0; }
    .chat-report .cr-deliverables li { border-top:1px solid #e5e8e2; padding:15px 0; }
    .chat-report .cr-deliverables li:first-child { padding-top:0; border-top:0; }
    .chat-report .cr-deliverables li:last-child { padding-bottom:0; }
    .chat-report .cr-source-list { margin:0; padding-left:20px; font-size:13px; }
    .chat-report .cr-source-list li { padding-left:4px; margin-bottom:13px; overflow-wrap:anywhere; }
    .chat-report .cr-source-list li:last-child { margin-bottom:0; }
    .chat-report .cr-source-list strong { font-weight:650; }
    .chat-report .cr-limits { border-top:1px solid var(--cr-line); background:#faf7ee; padding:20px 24px; }
    .chat-report .cr-limits h3 { font-size:13px; margin-bottom:10px; }
    .chat-report .cr-limits ul { padding-left:18px; margin:0; color:#665d48; font-size:12px; }
    .chat-report .cr-limits li + li { margin-top:6px; }
    .chat-report .cr-empty { font-size:13px; color:var(--cr-muted); }
    .chat-report .cr-footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--cr-muted); font-size:11px; padding:0 3px; }
    .chat-report .cr-footer strong { color:var(--cr-ink); letter-spacing:.07em; font-size:11px; }
    @media screen and (max-width:850px) {
      .chat-report .cr-kpis { grid-template-columns:repeat(2,minmax(0,1fr)); }
      .chat-report .cr-grid { grid-template-columns:minmax(0,1fr); gap:0; }
      .chat-report td, .chat-report th { padding-left:18px; padding-right:18px; }
    }
    @media screen and (max-width:540px) {
      .chat-report { padding:16px 12px; font-size:14px; }
      .chat-report .cr-hero { padding:25px 22px; border-radius:16px; }
      .chat-report h1 { font-size:29px; }
      .chat-report .cr-period { gap:14px 24px; }
      .chat-report .cr-summary { font-size:15px; margin:18px 3px 0; }
      .chat-report .cr-kpis { gap:10px; margin:21px 0; }
      .chat-report .cr-kpi { padding:16px 14px; border-radius:12px; }
      .chat-report .cr-kpi-label { min-height:36px; margin-bottom:7px; }
      .chat-report .cr-kpi-value { font-size:25px; }
      .chat-report .cr-kpi-value.cr-missing { font-size:17px; }
      .chat-report .cr-section-head { padding:20px 18px 15px; }
      .chat-report .cr-content { padding:0 18px 20px; }
      .chat-report .cr-limits { padding:18px; }
      .chat-report table, .chat-report tbody, .chat-report tr, .chat-report td { display:block; width:100%; }
      .chat-report thead { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); }
      .chat-report tr { border-top:1px solid var(--cr-line); padding:15px 18px; }
      .chat-report td { border:0; padding:0; }
      .chat-report td + td { padding-top:8px; }
      .chat-report .cr-result { margin-bottom:5px; font-size:17px; }
    }
    @media print {
      .chat-report { max-width:none; background:#fff; padding:0; font-size:10pt; print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      .chat-report .cr-hero { padding:22px 25px; border-radius:10px; }
      .chat-report h1 { font-size:27pt; }
      .chat-report .cr-summary { font-size:11pt; margin-top:15px; }
      .chat-report .cr-kpis { grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px; margin:18px 0; }
      .chat-report .cr-kpi { padding:13px 12px; }
      .chat-report .cr-kpi-value { font-size:21pt; }
      .chat-report .cr-kpi-value.cr-missing { font-size:13pt; }
      .chat-report .cr-kpi-note { font-size:8pt; }
      .chat-report .cr-section { overflow:visible; break-inside:auto; margin-bottom:18px; }
      .chat-report .cr-section-head { padding:15px 18px 12px; break-after:avoid; }
      .chat-report .cr-content { padding:0 18px 18px; }
      .chat-report .cr-grid { display:block; }
      .chat-report table { table-layout:fixed; }
      .chat-report .cr-table-wrap { overflow:visible; }
      .chat-report thead { display:table-header-group; }
      .chat-report tr, .chat-report .cr-kpi, .chat-report .cr-timeline li, .chat-report .cr-deliverables li, .chat-report .cr-source-list li { break-inside:avoid; }
      .chat-report th, .chat-report td { padding:11px 18px; }
      .chat-report a { color:inherit; }
      .chat-report .cr-footer { margin-top:18px; }
    }
  </style>
</head>
<body style="margin:0;background:#f2f3ee">
$report_body
</body>
</html>
